name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      PLC_TEST_DATABASE_URL: postgresql://plc:plc@127.0.0.1:5434/plc
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_DB: plc
          POSTGRES_USER: plc
          POSTGRES_PASSWORD: plc
        ports:
          - 5434:5432
        options: >-
          --health-cmd "pg_isready -U plc -d plc"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt
      - run: python -m pip install -r backend/requirements-dev.txt
      - run: PYTHONPATH=backend python -m pytest -q backend/tests

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm audit --omit=dev
      - run: npm run build

  deployment:
    name: deployment validation
    runs-on: ubuntu-latest
    env:
      PLC_AUTH_USERNAME: ci.operator
      PLC_AUTH_PASSWORD: ci-password-at-least-12
      PLC_AUTH_SECRET: ci-signing-secret-at-least-32-characters
      PLC_DB_PASSWORD: ci-database-password
      DATA_ROOT: /tmp/plc-data
      SA_KEY_PATH: /tmp/sa-key.json
    steps:
      - uses: actions/checkout@v4
      - run: docker compose config --quiet
      - run: docker compose -f docker-compose.prod.yml config --quiet
      - run: docker compose -f docker-compose.hetzner.yml config --quiet
      - run: docker compose build backend frontend
      - name: Validate Hetzner nginx
        run: >-
          docker run --rm
          -v "$PWD/deploy/hetzner/plc.conf:/etc/nginx/conf.d/default.conf:ro"
          nginx:1.27-alpine nginx -t

  deploy:
    name: deploy plc.tommy-huang.dev
    needs: [backend, frontend, deployment]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    concurrency:
      group: plc-production
      cancel-in-progress: false
    env:
      DEPLOY_HOST: ${{ secrets.HETZNER_HOST }}
      DEPLOY_USER: ${{ secrets.HETZNER_USER }}
      DEPLOY_PORT: ${{ secrets.HETZNER_PORT }}
      DEPLOY_SSH_KEY: ${{ secrets.HETZNER_SSH_KEY }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.HETZNER_KNOWN_HOSTS }}
      DEPLOY_APP_DIR: ${{ secrets.HETZNER_APP_DIR }}
      SIMULATOR_REPO_SSH_KEY: ${{ secrets.SIMULATOR_REPO_SSH_KEY }}
      PLC_AUTH_USERNAME: ${{ secrets.PLC_AUTH_USERNAME }}
      PLC_AUTH_PASSWORD: ${{ secrets.PLC_AUTH_PASSWORD }}
      PLC_AUTH_SECRET: ${{ secrets.PLC_AUTH_SECRET }}
    steps:
      - name: Check deployment configuration
        id: preflight
        shell: bash
        run: |
          if [[ -z "$DEPLOY_HOST" || -z "$DEPLOY_USER" || -z "$DEPLOY_SSH_KEY" || -z "$DEPLOY_KNOWN_HOSTS" || -z "$SIMULATOR_REPO_SSH_KEY" || -z "$PLC_AUTH_USERNAME" || -z "$PLC_AUTH_PASSWORD" || -z "$PLC_AUTH_SECRET" ]]; then
            echo "::warning::Hetzner deployment skipped: production environment secrets are incomplete."
            echo "enabled=false" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.preflight.outputs.enabled == 'true'

      - name: Checkout independent Plant Simulator
        if: steps.preflight.outputs.enabled == 'true'
        uses: actions/checkout@v4
        with:
          repository: Tommy840602/czochralski-simulator
          ref: main
          path: plant-simulator
          ssh-key: ${{ secrets.SIMULATOR_REPO_SSH_KEY }}
          persist-credentials: false

      - name: Configure SSH
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          install -d -m 700 "$HOME/.ssh"
          printf '%s\n' "$DEPLOY_SSH_KEY" > "$HOME/.ssh/id_ed25519"
          chmod 600 "$HOME/.ssh/id_ed25519"
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > "$HOME/.ssh/known_hosts"
          chmod 600 "$HOME/.ssh/known_hosts"

      - name: Sync verified main
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_APP_DIR:-/srv/plc/app}"
          simulator_dir="/srv/plant-simulator/app"
          ssh -p "$deploy_port" \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "install -d -m 755 '$deploy_dir' '$simulator_dir'"
          rsync --archive --compress --delete \
            --exclude='.git/' \
            --exclude='.env*' \
            -e "ssh -p $deploy_port -i $HOME/.ssh/id_ed25519 -o BatchMode=yes" \
            ./plant-simulator/ "$DEPLOY_USER@$DEPLOY_HOST:$simulator_dir/"
          rsync --archive --compress --delete \
            --exclude='.git/' \
            --exclude='.env*' \
            --exclude='plant-simulator/' \
            -e "ssh -p $deploy_port -i $HOME/.ssh/id_ed25519 -o BatchMode=yes" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$deploy_dir/"

      - name: Configure PLC production environment
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_APP_DIR:-/srv/plc/app}"
          dotenv_line() {
            local key="$1"
            local value="${2//\'/\\\'}"
            printf "%s='%s'\n" "$key" "$value"
          }
          {
            dotenv_line PLC_AUTH_USERNAME "$PLC_AUTH_USERNAME"
            printf 'PLC_AUTH_ENGINEER_USERNAME=plc.engineer\n'
            printf 'PLC_AUTH_LEAD_USERNAME=plc.lead\n'
            dotenv_line PLC_AUTH_PASSWORD "$PLC_AUTH_PASSWORD"
            dotenv_line PLC_AUTH_SECRET "$PLC_AUTH_SECRET"
            printf 'PLC_INGOT_CACHE_SIZE=16\n'
            printf 'PLC_RUNTIME_ENABLED=true\n'
            printf 'PLC_SCAN_INTERVAL_SECONDS=0.2\n'
            printf 'PLC_PLANT_OPCUA_ENDPOINT=opc.tcp://plant-simulator:4840/plant-simulator/server/\n'
            printf 'PLC_PLANT_OPCUA_NAMESPACE=urn:tommy-huang:cz-plant-simulator\n'
            printf 'PLC_PLANT_API_URL=http://plant-simulator:8090\n'
            printf 'SA_KEY_PATH=/home/tommy/spc-platform/deploy/hetzner/sa-key.json\n'
          } | ssh -p "$deploy_port" \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "set -euo pipefail; \
             current='$deploy_dir/.env.hetzner'; next='$deploy_dir/.env.hetzner.next'; \
             umask 077; cat > \"\$next\"; database_password=''; \
             if test -f \"\$current\"; then \
               database_password=\$(sed -n 's/^PLC_DB_PASSWORD=//p' \"\$current\" | tail -n 1); \
               database_password=\${database_password#\\'}; \
               database_password=\${database_password%\\'}; \
             fi; \
             if test -z \"\$database_password\"; then database_password=\$(openssl rand -hex 32); fi; \
             printf \"PLC_DB_PASSWORD='%s'\\n\" \"\$database_password\" >> \"\$next\"; \
             chmod 600 \"\$next\"; mv \"\$next\" \"\$current\""

      - name: Deploy independent Plant Simulator
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_APP_DIR:-/srv/plc/app}"
          # Stop the old PLC before replacing Plant. Its shutdown fail-safe may
          # assert E-STOP, which must target the old Plant instead of latching
          # the freshly deployed simulator in EMERGENCY_STOP.
          ssh -p "$deploy_port" \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$deploy_dir' \
              && if test -f .env.hetzner; then \
                   docker compose --env-file .env.hetzner -f docker-compose.hetzner.yml stop backend; \
                 fi"
          ssh -p "$deploy_port" \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$deploy_dir' && bash scripts/deploy-plant-simulator.sh /srv/plant-simulator/app"

      - name: Deploy verified main
        if: steps.preflight.outputs.enabled == 'true'
        shell: bash
        run: |
          deploy_port="${DEPLOY_PORT:-22}"
          deploy_dir="${DEPLOY_APP_DIR:-/srv/plc/app}"
          ssh -p "$deploy_port" \
            -i "$HOME/.ssh/id_ed25519" \
            -o BatchMode=yes \
            "$DEPLOY_USER@$DEPLOY_HOST" \
            "cd '$deploy_dir' && bash scripts/bootstrap-hetzner-env.sh && bash scripts/deploy-hetzner.sh '$GITHUB_SHA'"
