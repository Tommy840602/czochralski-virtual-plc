<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1120" viewBox="0 0 1800 1120" role="img" aria-labelledby="title desc">
  <title id="title">CZ Virtual PLC — Technology Architecture</title>
  <desc id="desc">Detailed architecture covering frontend, gateway, API, analytics, data access, cloud storage, security, observability, testing and deployment.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#07111f"/><stop offset="0.55" stop-color="#0b1830"/><stop offset="1" stop-color="#101724"/></linearGradient>
    <linearGradient id="hero" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#4ddfff"/><stop offset="0.5" stop-color="#748cff"/><stop offset="1" stop-color="#c071ff"/></linearGradient>
    <linearGradient id="blue" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#173f5f"/><stop offset="1" stop-color="#10253a"/></linearGradient>
    <linearGradient id="purple" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#402c6e"/><stop offset="1" stop-color="#241c42"/></linearGradient>
    <linearGradient id="green" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#17433f"/><stop offset="1" stop-color="#102d2b"/></linearGradient>
    <linearGradient id="amber" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#5d3b20"/><stop offset="1" stop-color="#322316"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="9" stdDeviation="12" flood-color="#000" flood-opacity="0.35"/></filter>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#9fc1df" stroke-opacity="0.05"/></pattern>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#64dcff"/></marker>
    <marker id="arrow2" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto"><path d="M0 0L11 5.5L0 11Z" fill="#b494ff"/></marker>
    <style>
      .title{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:42px;font-weight:800;fill:#f5f8ff}.sub{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:17px;font-weight:500;fill:#9fb2cb}.section{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:800;fill:#72dfff;letter-spacing:2.3px}.boxTitle{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:20px;font-weight:750;fill:#f7f9ff}.body{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:13px;font-weight:500;fill:#bdc9da}.tiny{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11.5px;font-weight:650;fill:#aabbd0}.pill{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:750;fill:#e7f7ff}.arrowLabel{font-family:Inter,Segoe UI,Arial,sans-serif;font-size:11px;font-weight:750;fill:#77e1ff}
    </style>
  </defs>
  <rect width="1800" height="1120" fill="url(#bg)"/><rect width="1800" height="1120" fill="url(#grid)"/>
  <circle cx="1650" cy="70" r="300" fill="#5f7dff" opacity="0.07"/><circle cx="120" cy="1050" r="340" fill="#34d4c3" opacity="0.05"/>
  <text x="70" y="72" class="title">CZ Virtual PLC</text><text x="70" y="105" class="sub">Full-stack control and analytics architecture for simulated Czochralski crystal-growth PLC time series</text><rect x="70" y="126" width="860" height="4" rx="2" fill="url(#hero)"/>
  <g transform="translate(1500 48)"><rect width="230" height="66" rx="18" fill="#0e2036" stroke="#305372"/><circle cx="30" cy="33" r="11" fill="#37d7a5"/><text x="52" y="28" class="tiny">VIRTUAL PLC PLATFORM</text><text x="52" y="48" class="body">Offline · Simulated data</text></g>

  <text x="70" y="175" class="section">USER EXPERIENCE &amp; EDGE</text>
  <g filter="url(#shadow)"><rect x="70" y="194" width="250" height="138" rx="20" fill="url(#blue)" stroke="#2e6789"/><text x="95" y="232" class="boxTitle">Engineer Browser</text><text x="95" y="261" class="body">Desktop / laptop analytics access</text><text x="95" y="287" class="tiny">HTTPS · token session · responsive UI</text><rect x="95" y="301" width="82" height="20" rx="10" fill="#214d69"/><text x="112" y="315" class="pill">Browser</text></g>
  <g filter="url(#shadow)"><rect x="365" y="194" width="355" height="138" rx="20" fill="url(#purple)" stroke="#7357ad"/><text x="390" y="232" class="boxTitle">Vue 3 Analytics SPA</text><text x="390" y="261" class="body">Interactive dashboards, drill-down and filters</text><text x="390" y="287" class="tiny">Overview · Explorer · Precursor · Warning · Profile · Control · Quality · Risk</text><g transform="translate(390 301)"><rect width="56" height="20" rx="10" fill="#523d80"/><text x="13" y="14" class="pill">Vite</text><rect x="66" width="76" height="20" rx="10" fill="#523d80"/><text x="78" y="14" class="pill">ECharts</text><rect x="152" width="66" height="20" rx="10" fill="#523d80"/><text x="167" y="14" class="pill">Pinia</text></g></g>
  <g filter="url(#shadow)"><rect x="765" y="194" width="285" height="138" rx="20" fill="#13283d" stroke="#345f7d"/><text x="790" y="232" class="boxTitle">Nginx Gateway</text><text x="790" y="261" class="body">Static hosting + reverse proxy</text><text x="790" y="287" class="tiny">Single origin · /api routing · compression</text><rect x="790" y="301" width="105" height="20" rx="10" fill="#21445e"/><text x="806" y="315" class="pill">Port 8080</text></g>
  <path d="M320 263H355" stroke="#64dcff" stroke-width="3" marker-end="url(#arrow)"/><path d="M720 263H755" stroke="#64dcff" stroke-width="3" marker-end="url(#arrow)"/>

  <text x="70" y="385" class="section">APPLICATION &amp; ANALYTICS</text>
  <rect x="70" y="404" width="1130" height="430" rx="28" fill="#091524" fill-opacity="0.84" stroke="#2d4863" stroke-width="1.5"/>
  <text x="100" y="441" class="boxTitle">FastAPI Backend</text><text x="100" y="466" class="body">Layered architecture with strict separation between transport, domain logic and data access</text>
  <g filter="url(#shadow)"><rect x="105" y="496" width="210" height="120" rx="18" fill="#172b40" stroke="#315d7d"/><text x="128" y="533" class="boxTitle">API Routes</text><text x="128" y="562" class="body">REST / JSON endpoints</text><text x="128" y="588" class="tiny">Validation · error mapping · auth guard</text></g>
  <g filter="url(#shadow)"><rect x="350" y="496" width="360" height="120" rx="18" fill="url(#purple)" stroke="#7154aa"/><text x="374" y="533" class="boxTitle">Domain Services</text><text x="374" y="562" class="body">Catalog · Series · Precursor · Profile</text><text x="374" y="588" class="tiny">Quality · Risk · PID replay · early warning</text></g>
  <g filter="url(#shadow)"><rect x="745" y="496" width="420" height="120" rx="18" fill="url(#green)" stroke="#337870"/><text x="770" y="533" class="boxTitle">Repository Abstraction</text><text x="770" y="562" class="body">DataRepository → ParquetRepository</text><text x="770" y="588" class="tiny">fsspec · local/GCS switch · LRU cache</text></g>
  <path d="M315 556H340" stroke="#b494ff" stroke-width="3" marker-end="url(#arrow2)"/><path d="M710 556H735" stroke="#b494ff" stroke-width="3" marker-end="url(#arrow2)"/>

  <g><rect x="105" y="654" width="245" height="142" rx="17" fill="#10263b" stroke="#2d6788"/><text x="128" y="689" class="boxTitle">Signal Processing</text><text x="128" y="717" class="body">LTTB downsampling</text><text x="128" y="741" class="body">Phase segmentation</text><text x="128" y="765" class="body">Rolling windows / normalization</text></g>
  <g><rect x="375" y="654" width="245" height="142" rx="17" fill="#2c2149" stroke="#6c50a5"/><text x="398" y="689" class="boxTitle">SPC &amp; Statistics</text><text x="398" y="717" class="body">I-MR · EWMA · CUSUM</text><text x="398" y="741" class="body">ROC / PR · BH-FDR</text><text x="398" y="765" class="body">Kaplan-Meier · AUC</text></g>
  <g><rect x="645" y="654" width="245" height="142" rx="17" fill="#14332f" stroke="#33776f"/><text x="668" y="689" class="boxTitle">ML Analytics</text><text x="668" y="717" class="body">scikit-learn · SciPy</text><text x="668" y="741" class="body">PCA · T² · SPE</text><text x="668" y="765" class="body">L2 logistic regression</text></g>
  <g><rect x="915" y="654" width="250" height="142" rx="17" fill="#3a291b" stroke="#7d5730"/><text x="938" y="689" class="boxTitle">Control Analytics</text><text x="938" y="717" class="body">PID open-loop replay</text><text x="938" y="741" class="body">Gain / velocity / derivative</text><text x="938" y="765" class="body">IAE · ITAE · overshoot</text></g>

  <text x="1250" y="385" class="section">DATA PLATFORM</text>
  <g filter="url(#shadow)"><rect x="1250" y="404" width="480" height="205" rx="24" fill="url(#green)" stroke="#337b72"/><text x="1280" y="445" class="boxTitle">Google Cloud Storage Data Lake</text><text x="1280" y="476" class="body">Parquet / CSV analytical datasets</text><text x="1280" y="505" class="tiny">rawdata/g1..g4 · table2 · segment summary</text><text x="1280" y="530" class="tiny">precursor windows · profile bands · scores</text><g transform="translate(1280 556)"><rect width="90" height="22" rx="11" fill="#22534d"/><text x="1300" y="15" class="pill">Parquet</text><rect x="100" width="70" height="22" rx="11" fill="#22534d"/><text x="119" y="15" class="pill">CSV</text><rect x="180" width="112" height="22" rx="11" fill="#22534d"/><text x="196" y="15" class="pill">Object Viewer</text></g></g>
  <g filter="url(#shadow)"><rect x="1250" y="640" width="480" height="194" rx="24" fill="#13283d" stroke="#345f7d"/><text x="1280" y="680" class="boxTitle">Replaceable Query Layer</text><text x="1280" y="710" class="body">Scale path without changing API or services</text><text x="1280" y="740" class="tiny">DuckDB for embedded analytics</text><text x="1280" y="765" class="tiny">PostgreSQL / TimescaleDB for indexed time-series</text><text x="1280" y="790" class="tiny">Future event-driven ingestion via Kafka / Pub/Sub</text></g>
  <path d="M1165 556H1238" stroke="#64dcff" stroke-width="3" marker-end="url(#arrow)"/><text x="1177" y="542" class="arrowLabel">fsspec</text>

  <text x="70" y="885" class="section">PLATFORM ENGINEERING</text>
  <g filter="url(#shadow)"><rect x="70" y="904" width="315" height="145" rx="20" fill="url(#amber)" stroke="#805a33"/><text x="95" y="942" class="boxTitle">Security</text><text x="95" y="971" class="body">HMAC token · 12h TTL</text><text x="95" y="996" class="tiny">All /api endpoints protected</text><text x="95" y="1020" class="tiny">ADC / Workload Identity · no embedded keys</text></g>
  <g filter="url(#shadow)"><rect x="415" y="904" width="315" height="145" rx="20" fill="#14283d" stroke="#345f7d"/><text x="440" y="942" class="boxTitle">Testing &amp; Quality</text><text x="440" y="971" class="body">pytest · API contract tests</text><text x="440" y="996" class="tiny">Frontend unit tests · Playwright E2E</text><text x="440" y="1020" class="tiny">Static analysis · dependency scanning</text></g>
  <g filter="url(#shadow)"><rect x="760" y="904" width="315" height="145" rx="20" fill="#14332f" stroke="#33776f"/><text x="785" y="942" class="boxTitle">Observability</text><text x="785" y="971" class="body">Structured logs · metrics · traces</text><text x="785" y="996" class="tiny">Prometheus · Grafana · OpenTelemetry</text><text x="785" y="1020" class="tiny">ELK / Cloud Logging integration</text></g>
  <g filter="url(#shadow)"><rect x="1105" y="904" width="315" height="145" rx="20" fill="#2c2149" stroke="#6c50a5"/><text x="1130" y="942" class="boxTitle">Delivery</text><text x="1130" y="971" class="body">Docker multi-stage builds</text><text x="1130" y="996" class="tiny">Docker Compose for local deployment</text><text x="1130" y="1020" class="tiny">GitHub Actions CI/CD</text></g>
  <g filter="url(#shadow)"><rect x="1450" y="904" width="280" height="145" rx="20" fill="#13283d" stroke="#345f7d"/><text x="1475" y="942" class="boxTitle">GCP Runtime</text><text x="1475" y="971" class="body">Cloud Run · GCE · GKE</text><text x="1475" y="996" class="tiny">Horizontal scaling path</text><text x="1475" y="1020" class="tiny">Stateless API containers</text></g>
  <path d="M908 332V392Q908 404 896 404H210Q198 404 198 486" stroke="#64dcff" stroke-width="3" fill="none" marker-end="url(#arrow)"/><text x="922" y="377" class="arrowLabel">REST / JSON</text>
  <text x="70" y="1090" class="tiny">Design principle: replace the storage and deployment layers without rewriting domain services or API contracts.</text>
</svg>
