# PLC 研究平台 —— Hetzner 主機 nginx 設定（與 SPC 共用同一台 nginx）。
# 模式同 spc.conf：主機 nginx 托管前端 dist + 反向代理 /api 到後端容器。
#
# 安裝：
#   sudo cp deploy/hetzner/plc.conf /etc/nginx/sites-available/plc.conf
#   sudo ln -s /etc/nginx/sites-available/plc.conf /etc/nginx/sites-enabled/plc.conf
#   sudo nginx -t && sudo systemctl reload nginx
#   sudo certbot --nginx -d plc.tommy-huang.dev   # 簽 TLS，會自動補 443 區塊
#
# 前端 dist 放 /var/www/plc-frontend/；後端容器監聽 127.0.0.1:8000。

# 登入端點 per-IP 限速（http context）
limit_req_zone $binary_remote_addr zone=plc_login:10m rate=10r/m;

server {
    server_name plc.tommy-huang.dev;
    server_tokens off;
    # certbot --nginx 會在此補上 ACME challenge 與到 443 的轉址。

    root /var/www/plc-frontend;
    index index.html;
    access_log /var/log/nginx/plc-access.log;
    client_max_body_size 4m;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; font-src 'self' data:; object-src 'none'; base-uri 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header Cross-Origin-Opener-Policy "same-origin" always;
    add_header Cross-Origin-Resource-Policy "same-origin" always;
    # HTTP 回應上的 HSTS 會被忽略；certbot 加入 TLS 後同一設定即生效。
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # 登入端點：per-IP 限速，優先於一般 /api 匹配
    location = /api/auth/login {
        limit_req zone=plc_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # 其餘 API 反代到後端容器
    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # BEGIN PLC CACHE POLICY
    # index.html 每次都需重新驗證，避免部署後仍載入舊版 hashed assets。
    location = /index.html {
        expires -1;
        try_files /index.html =404;
    }

    # Vite assets 帶 content hash，可安全長期快取。
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }
    # END PLC CACHE POLICY

    # SPA：其餘路徑回 index.html 交給 vue-router。
    location / {
        try_files $uri $uri/ /index.html;
    }
}
