services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: plc
      POSTGRES_USER: plc
      POSTGRES_PASSWORD: ${PLC_DB_PASSWORD:-plc}
    ports:
      - "127.0.0.1:${PLC_DB_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U plc -d plc"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  backend:
    build: ./backend
    environment:
      # GCS URI；部署在 GCP 時使用服務帳號的 Application Default Credentials。
      PLC_DATA_ROOT: ${PLC_DATA_ROOT:-gs://your-bucket/plc-data}
      PLC_GCS_PROJECT: ${PLC_GCS_PROJECT:-}
      # 登入設定（於 .env 覆寫；未設則用程式預設 admin / admin0000）
      PLC_AUTH_USERNAME: ${PLC_AUTH_USERNAME:-admin}
      PLC_AUTH_ENGINEER_USERNAME: ${PLC_AUTH_ENGINEER_USERNAME:-plc.engineer}
      PLC_AUTH_LEAD_USERNAME: ${PLC_AUTH_LEAD_USERNAME:-plc.lead}
      PLC_AUTH_PASSWORD: ${PLC_AUTH_PASSWORD:-admin0000}
      PLC_AUTH_SECRET: ${PLC_AUTH_SECRET:-dev-secret-change-me-please-use-32+chars}
      PLC_DATABASE_URL: postgresql://plc:${PLC_DB_PASSWORD:-plc}@postgres:5432/plc
      # Virtual PLC 與獨立 Plant Simulator 的通訊設定。
      PLC_RUNTIME_ENABLED: ${PLC_RUNTIME_ENABLED:-false}
      PLC_SCAN_INTERVAL_SECONDS: ${PLC_SCAN_INTERVAL_SECONDS:-0.2}
      PLC_PLANT_OPCUA_ENDPOINT: ${PLC_PLANT_OPCUA_ENDPOINT:-opc.tcp://plant-simulator:4840/plant-simulator/server/}
      PLC_PLANT_OPCUA_NAMESPACE: ${PLC_PLANT_OPCUA_NAMESPACE:-urn:tommy-huang:cz-plant-simulator}
      PLC_PLANT_API_URL: ${PLC_PLANT_API_URL:-http://plant-simulator:8090}
    expose:
      - "8000"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    depends_on:
      - backend
    ports:
      - "${WEB_PORT:-8080}:80"
    restart: unless-stopped

volumes:
  postgres-data:
